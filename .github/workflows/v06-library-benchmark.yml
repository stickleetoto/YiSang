name: v0.6 Roland benchmark

on:
  workflow_dispatch:

jobs:
  library-benchmark:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run deterministic Roland benchmark
        run: |
          mkdir -p artifacts
          yisang-eval-library --output "artifacts/library-v06-py${{ matrix.python-version }}.json"
          yisang-eval-library-check --input "artifacts/library-v06-py${{ matrix.python-version }}.json"

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: library-v06-py${{ matrix.python-version }}
          path: artifacts/library-v06-py${{ matrix.python-version }}.json
