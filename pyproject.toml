[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yisang"
version = "0.7.0.dev0"
description = "Model-independent LLM enhancement layer with externalized memory and capabilities."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yisang-model-server = "yisang.server.__main__:main"
yisang-codex-catalog = "yisang.integrations.codex:main"
yisang-eval-repeatability = "yisang.eval.repeatability:main"
yisang-eval-codex = "yisang.eval.codex_runner:main"
yisang-eval-memory = "yisang.eval.memory_benchmark:main"
yisang-eval-library = "yisang.eval.library_benchmark:main"
yisang-eval-library-check = "yisang.eval.library_benchmark_check:main"
yisang-eval-continuity = "yisang.eval.continuity_runner:main"
yisang-eval-v06-closeout = "yisang.eval.v06_closeout:main"
yisang-eval-continuity-check = "yisang.eval.continuity_check:main"
yisang-memory-archive = "yisang.memory.transfer:main"
yisang-memory-audit = "yisang.memory.audit:main"
yisang-experience-audit = "yisang.experience.audit:main"
yisang-experience-smoke = "yisang.experience.smoke:main"
yisang-generalization-smoke = "yisang.experience.generalization_smoke:main"
yisang-real-replay-smoke = "yisang.experience.real_replay_smoke:main"
yisang-trace-replay-smoke = "yisang.experience.trace_replay_smoke:main"
yisang-ego-v2-smoke = "yisang.ego.smoke_v2:main"
yisang-ego-promotion-smoke = "yisang.ego.promotion_smoke:main"
yisang-ego-lifecycle-smoke = "yisang.ego.lifecycle_smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
