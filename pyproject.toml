[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yisang"
version = "0.3.1"
description = "Model-independent LLM enhancement layer with externalized memory and capabilities."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yisang-model-server = "yisang.server.__main__:main"
yisang-codex-catalog = "yisang.integrations.codex:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
